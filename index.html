<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiftLog</title>

  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#5D8CFF">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style/landing.css">

  <script>
    if (localStorage.getItem("hasSeenLanding") === "true") {
      window.location.replace("home.html");
    }
  </script>
</head>

<body>

<section class="landing">

  <img src="image/landing-hero.jpeg" class="hero-image" alt="">

  <div class="overlay"></div>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="glow glow-3"></div>

  <div class="hero-content">

    <div class="logo">
      <i class="bi bi-activity"></i>
      <span>LiftLog</span>
    </div>

    <div class="bottom-area">

      <span class="hero-badge">
        YOUR PERSONAL TRAINING JOURNEY
      </span>

      <h1>
        <span class="word-plan">Plan.</span>
        <br>
        <span class="word-lift">Lift.</span>
        <br>
        <span class="word-progress">Progress.</span>
      </h1>

      <p>
        Build consistency, track every workout and stay stronger every day.
      </p>

      <a href="home.html" class="hero-btn" id="getStartedBtn">
        <span>Get Started</span>
        <div class="hero-btn-icon">
          <i class="bi bi-chevron-right"></i>
        </div>
      </a>

    </div>

  </div>

</section>

<script>
  document.getElementById("getStartedBtn").addEventListener("click", function () {
    localStorage.setItem("hasSeenLanding", "true");
  });
</script>

</body>
</html>
