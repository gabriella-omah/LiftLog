<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LiftLog</title>

<link rel="manifest" href="/manifest.json">

<meta name="theme-color" content="#5D8CFF">

<link rel="apple-touch-icon" href="icons/icon-192.png">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Page CSS -->
<link rel="stylesheet" href="style/landing.css">

<script>
    // Skip landing if user already clicked Get Started
    if (localStorage.getItem("hasSeenLanding") === "true") {
        window.location.replace("index.html");
    }
</script>

</head>

<body>

<section class="landing">

    <img src="image/landing-image.jpeg" class="hero-image" alt="">

    <div class="overlay"></div>

    <div class="hero-content">

        <div class="logo">
            <i class="bi bi-activity"></i>
            <span>LiftLog</span>
        </div>

        <span class="hero-badge">
            YOUR PERSONAL TRAINING JOURNEY
        </span>

         <div class="bottom-area">

        <h1>
            Plan.
            <br>
            <span class="word-lift">
            
            Lift.
            </span>
            <span class="word-progress">
            <br>
            
            Progress.
            </span>
        </h1>

        <p>
            Build consistency, track every workout and stay stronger every day.
        </p>

       

            <a href="index.html" class="hero-btn" id="getStartedBtn">
                <span>Get Started</span>
                <div class="hero-btn-icon">
                    <i class="bi bi-chevron-right"></i>
                </div>
            </a>

        </div>

    </div>

</section>

<script>
    document.getElementById("getStartedBtn").addEventListener("click", function () {
        localStorage.setItem("hasSeenLanding", "true");
    });
</script>

</body>
</html>
