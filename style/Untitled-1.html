list.forEach(exercise => {
        library.innerHTML += `
            <section class="exercise-card">
                <div class="card-body">
                    <div class="exercise-info">
                        <h4>${exercise.name}</h4>
                        <p class="muscle-badge ${String(exercise.muscle || "")
                            .toLowerCase()
                            .replace(/\s+/g, "-")}">
                            ${exercise.muscle || ""}
                        </p>
                        <small>
                            ${exercise.equipment || ""}
                            •
                            ${exercise.type || ""}
                            •
                            ${exercise.difficulty || ""}
                        </small>
                        <button
                            class="btn btn-success mt-3 w-100 viewExerciseBtn"
                            type="button"
                            data-id="${exercise.id}">
                            View Exercise
                        </button>
                    </div>
                </div>
            </section>
        `;
    });
